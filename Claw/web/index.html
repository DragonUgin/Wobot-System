<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乌波 // 极限挑战游戏系统</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Archivo+Black&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#e8e1cf;--bg-light:#f1ebd9;--bg-card:#ede5d5;--panel-bg:#0d0a08;
  --border:#1a1612;--amber:#d97706;--amber-bright:#f59e0b;--amber-pale:#fde68a;
  --mustard:#ca8a04;--orange:#ea580c;--red:#b91c1c;--green:#15803d;--green-bright:#22c55e;--teal:#0e7490;--teal-bright:#22d3ee;
  --warm-gray:#78716c;--warm-gray-light:#a8a29e;
  --mono:'JetBrains Mono','Courier New',monospace;
  --display:'Archivo Black','Arial Black',sans-serif;
  --cn:'Noto Sans SC',sans-serif;
}
html{scroll-behavior:smooth;}
body{font-family:var(--mono);background:var(--bg);color:var(--border);min-height:100vh;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.012) 3px,rgba(0,0,0,0.012) 4px),
    radial-gradient(circle at 25% 15%,rgba(217,119,6,0.06),transparent 55%),
    radial-gradient(circle at 75% 85%,rgba(180,83,9,0.05),transparent 60%);
  overflow-x:hidden;}
@keyframes heroGlitch{0%,100%{clip-path:inset(0 0 0 0);transform:translate(0)}5%{clip-path:inset(20% 0 60% 0);transform:translate(-3px,1px)}10%{clip-path:inset(50% 0 30% 0);transform:translate(2px,-1px)}15%{clip-path:inset(10% 0 70% 0);transform:translate(-1px)}20%{clip-path:inset(0 0 0 0);transform:translate(0)}}
@keyframes heroEntrance{from{opacity:0;transform:translateY(-40px) scale(0.95);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes slideInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes barFill{from{width:0%}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0.15}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 2px var(--amber-bright),0 0 6px var(--amber)}50%{text-shadow:0 0 4px var(--amber-bright),0 0 12px var(--amber),0 0 20px #92400e}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px) rotate(-1deg)}30%{transform:translateX(6px) rotate(1deg)}45%{transform:translateX(-4px) rotate(-0.5deg)}60%{transform:translateX(4px) rotate(0.5deg)}75%{transform:translateX(-2px)}}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(0.92) translateY(-20px)}to{opacity:1;transform:scale(1) translateY(0)}}

.topbar{position:relative;z-index:10;background:var(--border);color:var(--amber-bright);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--amber);box-shadow:0 6px 0 0 rgba(0,0,0,0.2);overflow:hidden;}
.topbar::after{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--amber-bright),transparent);}
.brand h1{font-family:var(--display);font-size:24px;font-weight:900;color:var(--amber-bright);animation:glowPulse 3s infinite,heroEntrance 0.8s ease-out;}
.sub{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:2px;text-transform:uppercase;margin-left:14px;}
.top-status{display:flex;align-items:center;gap:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;}
.dot{width:8px;height:8px;background:var(--green-bright);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--green-bright);animation:blink 1.5s infinite;}
.clock{color:var(--amber-bright);font-weight:800;font-size:12px;}

.nav-bar{display:flex;border-bottom:4px solid var(--border);background:var(--bg-card);z-index:5;position:relative;}
.nav-tab{flex:1;padding:12px 6px;text-align:center;font-family:var(--display);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-right:3px solid var(--border);transition:all 0.12s;color:var(--border);}
.nav-tab:last-child{border-right:none;}
.nav-tab:hover{background:var(--amber);}
.nav-tab.active{background:var(--border);color:var(--amber-bright);}

.marquee-bar{background:var(--border);border-bottom:3px solid var(--amber);overflow:hidden;position:relative;z-index:9;display:flex;align-items:center;}
.marquee-label{background:var(--amber);color:var(--border);font-family:var(--display);font-size:11px;font-weight:900;padding:10px 14px;text-transform:uppercase;letter-spacing:2px;border-right:3px solid var(--border);z-index:2;}
.marquee-track{display:flex;flex:1;animation:marquee 28s linear infinite;white-space:nowrap;}
.marquee-track:hover{animation-play-state:paused;}
.mq-item{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-right:1px solid #2a2520;font-size:12px;color:var(--amber-bright);cursor:pointer;transition:all 0.12s;}
.mq-item:hover{background:var(--amber);color:var(--border);}
.mq-time{color:var(--warm-gray-light);font-size:10px;font-weight:700;}
.mq-name{color:var(--bg-light);font-weight:800;}
.mq-item.selected{border:2px solid var(--amber);border-radius:3px;margin:-2px;}
.mq-undo{background:var(--red);color:#fff;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:800;cursor:pointer;margin-left:6px;transition:all 0.12s;}
.mq-undo:hover{background:var(--amber);color:var(--border);}

.terminal{background:var(--panel-bg);color:var(--amber-bright);border:3px solid var(--border);box-shadow:6px 6px 0 0 var(--border);position:relative;overflow:hidden;margin-bottom:18px;}
.terminal-head{background:var(--border);color:var(--amber-bright);padding:9px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:2px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--amber);}
.terminal-head .cls{color:var(--orange);font-size:10px;animation:blink 1.8s infinite;}
.terminal-body{padding:16px;font-size:12px;line-height:1.8;position:relative;min-height:160px;}
.terminal-body::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(217,119,6,0.04) 2px,rgba(217,119,6,0.04) 4px);pointer-events:none;}
.tl{color:var(--green-bright);}.tk{color:var(--amber);}.tv{color:var(--bg-light);}.tw{color:var(--orange);}.to{color:var(--green-bright);}
.tcursor{display:inline-block;width:7px;height:14px;background:var(--amber-bright);vertical-align:middle;margin-left:2px;animation:blink 0.7s step-end infinite;}

.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px;}

.panel{background:var(--bg-card);border:3px solid var(--border);box-shadow:6px 6px 0 0 var(--border);margin-bottom:18px;position:relative;transition:transform 0.15s,box-shadow 0.15s;}
.panel:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 0 var(--border);}
.panel-header{background:var(--amber);color:var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;border-bottom:3px solid var(--border);}
.panel-header.dark{background:var(--border);color:var(--amber-bright);}
.panel-header .tag{background:var(--border);color:var(--amber-bright);font-size:9px;font-weight:800;padding:2px 8px;}
.panel-header.dark .tag{background:var(--amber);color:var(--border);}
.panel-body{padding:14px;}

.timer-block{text-align:center;padding:20px 14px;}
.timer-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:3px;color:var(--warm-gray);margin-bottom:8px;}
.timer-display{font-size:72px;font-weight:800;line-height:1;letter-spacing:-2px;text-shadow:4px 4px 0 var(--amber);}
.timer-colon{animation:blink 1s step-end infinite;}
.timer-status-line{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-top:10px;}

.dew-progress{margin:14px 0;}
.dew-bar{height:28px;border:3px solid var(--border);background:var(--bg-light);position:relative;overflow:hidden;}
.dew-bar-fill{height:100%;background:var(--amber);transition:width 1.2s ease;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--border);}
.dew-text{text-align:center;font-size:14px;font-weight:800;margin-top:6px;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;margin-bottom:0;}
.stat-box{background:var(--bg-card);border:3px solid var(--border);box-shadow:4px 4px 0 0 var(--border);padding:14px 6px;text-align:center;cursor:pointer;transition:all 0.12s;}
.stat-box:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 0 var(--border);}
.stat-box .st-num{font-family:var(--display);font-size:32px;font-weight:900;line-height:1;}
.stat-box .st-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-top:4px;}
.sa{animation:slideInUp 0.4s 0.1s both;}
.sd{animation:slideInUp 0.4s 0.2s both;}
.sr{animation:slideInUp 0.4s 0.3s both;}

.rank-table{width:100%;border-collapse:collapse;font-family:var(--mono);}
.rank-table th{background:var(--border);color:var(--amber-bright);font-family:var(--display);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;padding:9px 6px;border:2px solid var(--border);}
.rank-table td{padding:8px 6px;border:2px solid var(--border);text-align:center;font-weight:700;font-size:12px;background:var(--bg-light);transition:background 0.12s;}
.rank-table tbody tr:hover td{background:var(--amber-pale);}
.rank-table td.c-green{color:var(--green);font-weight:800;}
.rank-table td.c-red{color:var(--red);font-weight:800;}
.rank-table td.c-amber{color:var(--amber);font-weight:800;}
.rank-table td.c-gray{color:var(--warm-gray);font-weight:800;}
.hp-outer{display:inline-block;width:100%;height:10px;background:var(--bg-light);border:1px solid var(--border);vertical-align:middle;overflow:hidden;}
.hp-inner{display:block;height:100%;background:var(--green);transition:width 0.4s;}
.hp-inner.hp-critical{background:var(--red);}

.controls{display:flex;gap:0;margin-top:18px;}
.ctrl-btn{flex:1;padding:16px 8px;font-family:var(--display);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:2px;background:var(--bg-card);color:var(--border);border:3px solid var(--border);border-right:none;cursor:pointer;box-shadow:5px 5px 0 0 var(--border);transition:all 0.1s;display:flex;flex-direction:column;align-items:center;gap:5px;}
.ctrl-btn:last-child{border-right:3px solid var(--border);}
.ctrl-btn:hover{background:var(--amber);transform:translate(-2px,-2px);box-shadow:7px 7px 0 0 var(--border);}
.ctrl-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 var(--border);}
.ctrl-btn.danger{background:var(--red);color:var(--bg-light);}
.ctrl-btn.danger:hover{background:var(--border);color:var(--amber-bright);}
.ctrl-icon{width:18px;height:18px;display:block;}

.dur-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;}
.dur-pill{display:inline-block;padding:6px 11px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--warm-gray);border:2px solid var(--border);background:var(--bg-card);cursor:pointer;box-shadow:2px 2px 0 0 var(--border);transition:all 0.1s;user-select:none;}
.dur-pill:hover{color:var(--amber-bright);border-color:var(--amber);transform:translate(-1px,-1px);box-shadow:3px 3px 0 0 var(--border);}
.dur-pill.active{background:var(--amber);color:#0d0a08;border-color:var(--amber);box-shadow:3px 3px 0 0 var(--border);}

.input-mono{font-family:var(--mono);padding:8px 10px;border:2px solid var(--border);background:var(--bg-light);font-size:13px;font-weight:700;color:var(--border);width:100%;}
.input-mono:focus{outline:none;border-color:var(--amber);}
select.input-mono{width:auto;}
.btn-sm{font-family:var(--display);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;padding:7px 14px;cursor:pointer;color:var(--border);background:var(--bg-card);border:2px solid var(--border);box-shadow:3px 3px 0 0 var(--border);transition:all 0.1s;white-space:nowrap;}
.btn-sm:hover{background:var(--amber);transform:translate(-1px,-1px);box-shadow:4px 4px 0 0 var(--border);}
.btn-sm:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--border);}
.btn-sm.danger{background:var(--red);color:var(--bg-light);}
.btn-sm.green{background:var(--green);color:var(--bg-light);}
.btn-sm.green:hover{background:var(--amber);color:var(--border);}
.btn-sm.amber{background:var(--amber);color:var(--border);}
.btn-sm.teal{background:var(--teal);color:var(--bg-light);}
.btn-sm.teal:hover{background:var(--amber);color:var(--border);}

.file-area{border:2px dashed var(--border);padding:18px;text-align:center;background:var(--bg-light);cursor:pointer;transition:all 0.12s;margin-bottom:10px;}
.file-area:hover{border-color:var(--amber);background:var(--amber-pale);}
.file-area input{display:none;}

.footer{background:var(--border);color:var(--amber);text-align:center;padding:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;border-top:4px solid var(--amber);position:relative;z-index:1;}
.toast{position:fixed;bottom:24px;right:24px;z-index:200;padding:10px 18px;font-size:12px;font-weight:800;color:var(--border);border:3px solid var(--border);box-shadow:4px 4px 0 0 var(--border);background:var(--bg-card);animation:toastIn 0.4s ease-out;}
.toast.success{border-color:var(--green);}
.toast.error{border-color:var(--red);}
.toast.info{border-color:var(--amber);}

.tp-status-chip{display:inline-block;padding:3px 9px;border:2px solid var(--border);font-family:var(--mono);font-size:11px;font-weight:800;cursor:pointer;background:var(--bg-light);min-width:52px;text-align:center;}
.tp-status-chip.s-on{background:var(--green);color:#fff;border-color:var(--green);}
.tp-status-chip.s-standby{background:var(--mustard);color:#1a1612;border-color:var(--mustard);}
.tp-status-chip.s-off{background:var(--warm-gray);color:#fff;border-color:var(--warm-gray);}
.tp-status-menu{position:absolute;z-index:50;top:100%;left:0;margin-top:5px;background:var(--panel-bg);border:2px solid var(--amber);box-shadow:4px 4px 0 0 var(--border);min-width:86px;}
.tp-status-opt{padding:7px 12px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--amber-pale);cursor:pointer;border-bottom:1px solid rgba(217,119,6,0.25);}
.tp-status-opt:last-child{border-bottom:none;}
.tp-status-opt:hover{background:rgba(217,119,6,0.18);color:#fff;}
.tp-backdrop{position:fixed;inset:0;z-index:40;}

.tp-item-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--border);transition:background 0.12s;}
.tp-item-row:last-child{border-bottom:none;}
.tp-item-row:hover{background:var(--bg-light);}
.tp-item-label{font-family:var(--display);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;min-width:56px;text-align:right;}
.tp-item-count{font-family:var(--display);font-size:22px;font-weight:900;color:var(--amber);min-width:48px;text-align:center;}
.tp-item-breakdown{font-size:11px;color:var(--warm-gray);flex:1;min-width:0;}
.tp-item-btn{display:flex;gap:4px;flex-shrink:0;}

.modal-overlay{position:fixed;inset:0;background:rgba(13,10,8,0.75);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-card{background:var(--bg-card);border:3px solid var(--border);box-shadow:8px 8px 0 0 var(--amber);width:100%;max-width:720px;max-height:88vh;overflow-y:auto;animation:modalIn 0.2s ease-out;}
.modal-card.wide{max-width:860px;}
.modal-header{background:var(--amber);color:var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;border-bottom:3px solid var(--border);}
.modal-close{cursor:pointer;font-size:18px;font-weight:900;line-height:1;padding:0 4px;}
.modal-body{padding:14px;}
.modal-info-tip{font-size:11px;color:var(--warm-gray);padding:8px 14px;background:var(--bg-light);border-bottom:2px solid var(--border);}

.modal-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:560px;}
.modal-form-grid.col3{grid-template-columns:1fr 1fr 1fr;}
.modal-form-grid.col4{grid-template-columns:1fr 1fr 1fr 1fr;}
.modal-form-grid.col2{grid-template-columns:1fr 1fr;}
.modal-form-grid.col1{grid-template-columns:1fr;}

.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.metric-card{background:var(--bg-light);border:2px solid var(--border);padding:10px 8px;text-align:center;}
.metric-card .mc-num{font-family:var(--display);font-size:26px;font-weight:900;line-height:1.1;}
.metric-card .mc-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--warm-gray);margin-top:3px;}

.pill-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.pill-dot.d-green{background:var(--green);}
.pill-dot.d-amber{background:var(--amber);}
.pill-dot.d-mustard{background:var(--mustard);}
.pill-dot.d-gray{background:var(--warm-gray);}
.pill-dot.d-red{background:var(--red);}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><h1 id="heroTitle">乌波 <span style="color:var(--amber)">//</span> 极限挑战</h1><span class="sub">露水收集管理系统</span></div>
    <div class="top-status"><span><span class="dot"></span>系统在线</span><span class="clock">{{ clock }}</span></div>
  </div>

  <div class="marquee-bar">
    <span class="marquee-label">实时动态</span>
    <div class="marquee-track" v-if="opsLog.length">
      <span v-for="e in opsLog" class="mq-item" :class="{selected:selectedOpsId===e.id}" @click="selectOps(e)">
        <span class="mq-time">{{ e.time }}</span>
        <span class="mq-name">{{ e.msg }}</span>
        <span v-if="selectedOpsId===e.id" class="mq-undo" @click.stop="undoEvent(e.id)">↩ 撤销</span>
      </span>
      <span v-for="e in opsLog" class="mq-item" :class="{selected:selectedOpsId===e.id}" @click="selectOps(e)">
        <span class="mq-time">{{ e.time }}</span>
        <span class="mq-name">{{ e.msg }}</span>
      </span>
    </div>
    <span v-else class="mq-item" style="pointer-events:none;"><span class="mq-name" style="color:var(--warm-gray-light);">等待第一条事件...</span></span>
  </div>

  <div class="nav-bar">
    <div v-for="t in tabs" :key="t.id" class="nav-tab" :class="{active:tab===t.id}" @click="switchTab(t.id)">{{ t.label }}</div>
  </div>

  <div class="main">

    <!-- ====== 指挥台 ====== -->
    <template v-if="tab==='dashboard'">
      <div style="display:flex;gap:20px;">
        <div style="width:300px;flex-shrink:0;">
          <div class="panel">
            <div class="panel-header"><span>任务倒计时</span><span class="tag">{{ st.status }}</span></div>
            <div class="timer-block">
              <div class="timer-display" :style="st.status==='进行中'&&st.remaining_seconds<300?'color:var(--red);text-shadow:4px 4px 0 var(--border)':''">
                <template v-if="st.status==='未开始'">--:--</template>
                <template v-else-if="st.status==='已结束'">00:00</template>
                <template v-else><span>{{ minStr }}</span><span class="timer-colon">:</span><span>{{ secStr }}</span></template>
              </div>
              <div class="timer-status-line" :style="st.status==='已结束'?'color:var(--warm-gray)':st.status==='进行中'&&st.remaining_seconds<300?'color:var(--red)':''"><span class="dot" style="margin-right:6px;" v-if="st.active"></span>{{ st.active?'时钟运行中':st.status }}</div>
            </div>
          </div>

          <div class="stat-row">
            <div class="stat-box sa"><div class="st-num" style="color:var(--green)">{{ st.dew_stats?.collected_value||0 }}</div><div class="st-lbl">已收集(滴)</div></div>
            <div class="stat-box sd"><div class="st-num" style="color:var(--warm-gray)">{{ (st.dew_stats?.total_value||0)-(st.dew_stats?.collected_value||0) }}</div><div class="st-lbl">未收集(滴)</div></div>
            <div class="stat-box sr"><div class="st-num" style="color:var(--amber)">{{ st.dew_pct||0 }}%</div><div class="st-lbl">进度</div></div>
          </div>

          <div class="controls" style="margin-top:14px;">
            <button class="ctrl-btn" @click="startGame" v-if="!st.active">开始</button>
            <div v-if="!st.active" class="dur-pills">
              <span v-for="m in [30,60,90,120,150,180]" :key="m" :class="['dur-pill', gameMinutes===m?'active':'']" @click="gameMinutes=m">{{ m }}'</span>
            </div>

        <!-- 任务点道具管理弹窗：金露水 -->

          <table class="rank-table" v-if="tpFilteredGD.length">
            <thead><tr><th>编号</th><th>状态</th><th>收集时间</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="d in tpFilteredGD" :key="d.id">
                <td>金露水 {{ d.id }}</td>
                <td :class="d.status==='已收集'?'c-green':d.status==='已使用'?'c-amber':'c-gray'">{{ d.status }}</td>
                <td>{{ d.collected_at||'—' }}</td>
                <td>
                  <button v-if="d.status==='未收集'" class="btn-sm amber" @click="collectGoldenDew(d.id)">标记收集</button>
                  <span v-if="d.status==='已收集'"><span style="color:var(--green);font-weight:800;">库存</span> <button class="btn-sm" @click="resetGoldenDew(d.id)">重置</button></span>
                  <span v-if="d.status==='已使用'" style="color:var(--warm-gray);">已消耗</span>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else style="padding:12px;text-align:center;color:var(--warm-gray);">该任务点暂无金露水</div>
        </template>

        <!-- 任务点道具管理弹窗：露水（真线索join过滤） -->
        <template v-if="modal.type==='dewManage'">
          <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
            <button class="btn-sm" @click="openModal('dewForm',{tpId:modal.data.id})">＋ 新增露水</button>
            <span style="font-size:11px;color:var(--warm-gray);margin-left:auto;">共 {{ tpFilteredDews.length }} 个 · 合计 {{ tpDewTotal }} 滴</span>
            <span v-if="tpFilteredDews.some(d=>d.hunter_name)" style="font-size:10px;color:#1aa3a3;width:100%;">⚠ 含猎人持有露水（双关联）：其滴数同时计入对应猎人卡片，请勿与猎人卡片相加重复统计</span>
          </div>
          <table class="rank-table" v-if="tpFilteredDews.length">
            <thead><tr><th>编号</th><th>露水值</th><th>对应真线索</th><th>状态</th><th>操作</th></tr></thead>
            <tbody>
              <tr v-for="d in tpFilteredDews" :key="d.id">
                <td>{{ d.id }}</td><td>{{ d.dew_value||2 }}滴</td>
                <td style="color:var(--warm-gray);font-size:11px;">{{ getClueContent(d.id)||'—' }}</td>
                <td :class="d.status==='已收集'?'c-green':d.status==='已发现未收集'?'c-amber':'c-gray'">{{ d.status }}<span v-if="d.hunter_name" style="margin-left:4px;font-size:10px;color:#1aa3a3;">·猎人{{ d.hunter_name }}持有</span></td>
                <td>
                  <button v-if="d.status==='已发现未收集'" class="btn-sm green" @click="collectDew(d.id)">收集</button>
                  <button v-if="d.status==='已收集'" class="btn-sm" @click="resetDew(d.id)">重置</button>
                  <button class="btn-sm" @click="openModal('dewForm',d)">编辑</button>
                  <button class="btn-sm danger" @click="deleteDew(d.id)">删除</button>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else style="padding:12px;text-align:center;color:var(--warm-gray);">该任务点暂无露水</div>
          <div style="margin-top:8px;font-size:10px;color:var(--warm-gray);">露水通过同编号真线索关联本任务点 · 新增露水：先在「线索管理」新建真线索（同编号归属本任务点），再在此新增同编号露水</div>
        </template>

        <!-- 任务点库存流水 -->
        <template v-if="modal.type==='inventory'">
          <div style="margin-bottom:8px;font-size:11px;color:var(--warm-gray);">任务点 {{ modal.data.id }} · {{ modal.data.name }} 物资/完成记录</div>
          <table class="rank-table" v-if="invItems.length">
            <thead><tr><th>时间</th><th>来源</th><th>物品类型</th><th>物品ID</th></tr></thead>
            <tbody>
              <tr v-for="r in invItems" :key="r.id">
                <td>{{ r.created_at }}</td><td>{{ r.source==='complete'?'完成送出':'接收入库' }}</td><td>{{ r.item_type }}</td><td>{{ r.item_id||'—' }}</td>
              </tr>
            </tbody>
          </table>
          <div v-else style="padding:12px;text-align:center;color:var(--warm-gray);">暂无库存流动记录</div>
        </template>

        <!-- 送出道具表单 -->
        <template v-if="modal.type==='tpComplete'">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:11px;color:var(--warm-gray);">线索编号</span><input class="input-mono" v-model="tpForm.clue_id" placeholder="无" style="width:70px;">
            <span style="font-size:11px;color:var(--warm-gray);">金露水</span><input class="input-mono" v-model="tpForm.golden_dew_count" type="number" min="0" style="width:60px;">
            <span style="font-size:11px;color:var(--warm-gray);">护盾卡</span><input class="input-mono" v-model="tpForm.shield_card_count" type="number" min="0" style="width:60px;">
            <span style="font-size:11px;color:var(--warm-gray);">静止卡</span><input class="input-mono" v-model="tpForm.static_card_count" type="number" min="0" style="width:60px;">
            <button class="btn-sm amber" @click="markTaskPointComplete">送出道具</button>
          </div>
          <div style="font-size:10px;color:var(--warm-gray);margin-top:4px;">完成送出 → 线索/金露水/护盾卡/静止卡 · 露水送出已砍掉(此弹窗不再送露水) · 金露水进库存 · 触发15秒全局免疫</div>
        </template>

        <!-- 接收物资表单 -->
        <template v-if="modal.type==='tpReceive'">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span style="font-size:11px;color:var(--warm-gray);">线索编号</span><input class="input-mono" v-model="tpForm.clue_id" placeholder="无" style="width:70px;">
            <span style="font-size:11px;color:var(--warm-gray);">露水编号</span><input class="input-mono" v-model="tpForm.dew_id" type="number" min="0" style="width:70px;" placeholder="无">
            <span style="font-size:11px;color:var(--warm-gray);">金露水</span><input class="input-mono" v-model="tpForm.golden_dew_count" type="number" min="0" style="width:60px;">
            <span style="font-size:11px;color:var(--warm-gray);">护盾卡</span><input class="input-mono" v-model="tpForm.shield_card_count" type="number" min="0" style="width:60px;">
            <span style="font-size:11px;color:var(--warm-gray);">静止卡</span><input class="input-mono" v-model="tpForm.static_card_count" type="number" min="0" style="width:60px;">
            <button class="btn-sm teal" @click="markTaskPointReceive">接收入库</button>
          </div>
          <div style="font-size:10px;color:var(--warm-gray);margin-top:4px;">接收入库 → 露水按编号精确收回任务点池（重置未收集） · 不触发全局免疫</div>
        </template>

      </div>
    </div>
  </div>

  <div class="footer"><span class="dot" style="animation:blink 1s infinite;"></span> 乌波 · 极限挑战游戏系统 v3.0 · 端口:8080 · NoneBot2</div>
  <div v-if="toast" class="toast" :class="toast.type">{{ toast.msg }}</div>

</div>
<script>
const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;
createApp({
  setup(){
    const tab=ref('dashboard');
    const tabs=[{id:'dashboard',label:'指挥台'},{id:'players',label:'玩家'},{id:'taskpoints',label:'任务点'},{id:'hunters',label:'猎人'},{id:'clues',label:'线索'},{id:'dews',label:'露水'},{id:'settings',label:'设置'}];
    const st=reactive({status:'加载中',active:false,remaining:'00:00',remaining_seconds:0,dew_stats:{total:0,collected:0},dew_pct:0});
    const dews=ref([]);const clues=ref([]);const taskPoints=ref([]);const players=ref([]);const goldenDews=ref([]);const hunters=ref([]);
    const tpForm=reactive({task_point_id:1,clue_id:'',dew_id:0,golden_dew_count:0,shield_card_count:0,static_card_count:0});
    const dewTargetInput=ref(0);const frenzyActive=ref(false);
    const edTP=reactive({id:0,name:'',tp_type:'solo',card_name:'无',golden_dew_count:0,status:'启用',static_card_count:0,static_card_collected:0,shield_card_count:0,shield_card_collected:0,origId:0});
    const statusMenuId=ref(null);
    const pstats=reactive({'存活':0,'淘汰':0,'复活':0,total:0,groups:[]});
    const playerSearch=ref('');const playerStatusFilter=ref('');
    const dewSearch=ref('');const dewFilter=ref('');
    const clueSearch=ref('');const clueTypeFilter=ref('');const clueStatusFilter=ref('');const clueTPFilter=ref('');
    const edClue=reactive({id:0,clue_type:'真',task_point_id:0,content:'',hidden_npc_name:null,hunter_name:null,origId:0});
    const edDew=reactive({id:0,dew_value:2,status:'未收集',origId:0,tpId:0,hunter_name:null,pool:'tp'});
    const edGD=reactive({id:0,task_point_id:1,origId:0});
    const edPlayer=reactive({id:0,group_num:1,name:'',note:'',origId:0});
    const cfg=reactive({game_group:'',work_group:'',backend_group:''});
    const cfgForm=reactive({game_group:'',work_group:'',backend_group:''});
    const toast=ref(null);const clock=ref('');
    const gameMinutes=ref(90);const importFile=ref(null);const importing=ref(false);
    const npcs=ref([]);const invItems=ref([]);
    const newHunterName=ref('');const assignClueId=ref(0);
    const newDewId=ref(0);const newDewVal=ref(2);
    const newClueId=ref(0);const newClueType=ref('真');const newClueContent=ref('');
    const hunterItems=computed(()=>{
      const name=modal.data?.name;
      if(!name)return {clues:[],dews:[]};
      const hc=clues.value.filter(c=>c.hunter_name===name);
      const hd=dews.value.filter(d=>d.hunter_name===name);
      return {clues:hc,dews:hd};
    });
    const orphanClues=computed(()=>clues.value.filter(c=>(!c.task_point_id&&!c.hunter_name)).sort((a,b)=>a.id-b.id));
    const unassignedClues=computed(()=>clues.value.filter(c=>!c.hunter_name).sort((a,b)=>a.id-b.id));
    const minStr=computed(()=>String(Math.floor(st.remaining_seconds/60)).padStart(2,'0'));
    const secStr=computed(()=>String(st.remaining_seconds%60).padStart(2,'0'));

    const modal=reactive({show:false,type:'',title:'',tip:'',data:{},wide:false});
    function openModal(type,data){
      modal.data=data||{};
      modal.wide=false;
      if(type==='playerForm'){modal.title=(data&&data.id)?'编辑玩家 '+data.group_num+'组 '+data.name:'新增玩家';
        edPlayer.id=data?.id||0;edPlayer.group_num=data?.group_num||1;edPlayer.name=data?.name||'';edPlayer.note=data?.note||'';edPlayer.origId=data?.id||0;}
      else if(type==='tpForm'){modal.title=(data&&data.id)?'编辑任务点 #'+data.id:'新增任务点';
        edTP.id=data?.id||0;edTP.name=data?.name||'';edTP.tp_type=data?.tp_type||'solo';edTP.card_name=data?.card_name||'无';
        edTP.golden_dew_count=data?.golden_dew_count||0;edTP.status=data?.status||'启用';
        edTP.static_card_count=data?.static_card_count||0;edTP.static_card_collected=data?.static_card_collected||0;
        edTP.shield_card_count=data?.shield_card_count||0;edTP.shield_card_collected=data?.shield_card_collected||0;
        edTP.origId=data?.id||0;}
      else if(type==='hunterManage'){modal.title='猎人管理 · '+(data&&data.name||'');}
      else if(type==='clueForm'){modal.title=(data&&data.id)?'编辑线索 #'+data.id:'新增线索';
        edClue.id=data?.id||0;edClue.clue_type=data?.clue_type||'真';edClue.task_point_id=data?.task_point_id||(modal.data.task_point_id||0);
        edClue.content=data?.content||'';edClue.hidden_npc_name=data?.hidden_npc_name||null;edClue.hunter_name=data?.hunter_name||null;edClue.origId=data?.id||0;}
      else if(type==='dewForm'){modal.title=(data&&data.id)?'编辑露水 #'+data.id:'新增露水';
        edDew.id=data?.id||0;edDew.dew_value=data?.dew_value||2;edDew.status=data?.status||'未收集';edDew.origId=data?.id||0;edDew.tpId=data?.tpId||0;edDew.hunter_name=data?.hunter_name||null;edDew.pool=data?.hunter_name?'hunter':'tp';}
      else if(type==='gdForm'){modal.title=(data&&data.id)?'编辑金露水 #'+data.id:'新增金露水';
        edGD.id=data?.id||0;edGD.task_point_id=data?.task_point_id||(modal.data.task_point_id||1);edGD.origId=data?.id||0;}
      else if(type==='clueManage'){modal.title='任务点 '+data.id+' · '+data.name+' / 线索管理';modal.wide=true;}
      else if(type==='gdManage'){modal.title='任务点 '+data.id+' · '+data.name+' / 金露水管理';}
      else if(type==='dewManage'){modal.title='任务点 '+data.id+' · '+data.name+' / 露水管理';
        modal.tip='露水通过同编号真线索归属本任务点 · 新增露水：先在线索管理新建真线索（同编号、归属本任务点），再在此新增同编号露水';modal.wide=true;}
      else if(type==='inventory'){modal.title='任务点 '+data.id+' · '+data.name+' / 库存流水';modal.wide=true;fetchInv(data.id);}
      else if(type==='tpComplete'){modal.title='任务点 '+data.id+' · '+data.name+' / 送出道具';tpForm.task_point_id=data.id;tpForm.clue_id='';tpForm.dew_id=0;tpForm.golden_dew_count=0;tpForm.shield_card_count=0;tpForm.static_card_count=0;}
      else if(type==='tpReceive'){modal.title='任务点 '+data.id+' · '+data.name+' / 接收物资';tpForm.task_point_id=data.id;tpForm.clue_id='';tpForm.dew_id=0;tpForm.golden_dew_count=0;tpForm.shield_card_count=0;tpForm.static_card_count=0;}
      modal.type=type;modal.show=true;
    }
    function closeModal(){modal.show=false;modal.type='';modal.tip='';modal.data={};invItems.value=[];edClue.origId=0;edDew.origId=0;edGD.origId=0;edPlayer.origId=0;}

    const tpFilteredClues=computed(()=>modal.data.id?clues.value.filter(c=>c.task_point_id===modal.data.id).sort((a,b)=>a.id-b.id):[]);
    const tpFilteredGD=computed(()=>modal.data.id?goldenDews.value.filter(d=>d.task_point_id===modal.data.id).sort((a,b)=>a.id-b.id):[]);
    const tpFilteredDews=computed(()=>{if(!modal.data.id)return[];const tpId=modal.data.id;
      const trueIds=new Set(clues.value.filter(c=>c.task_point_id===tpId&&c.clue_type==='真').map(c=>c.id));
      return dews.value.filter(d=>trueIds.has(d.id)).sort((a,b)=>a.id-b.id);});
    const tpDewTotal=computed(()=>tpFilteredDews.value.reduce((s,d)=>s+(d.dew_value||2),0));

    function getClueContent(id){const c=clues.value.find(c=>c.id===id&&c.clue_type==='真');return c?('真线索'+c.id+'·'+(c.content||'—').slice(0,20)):null;}
    function getDewTpName(dewId){const c=clues.value.find(c=>c.id===dewId&&c.clue_type==='真');if(!c)return '—';const tp=taskPoints.value.find(t=>t.id===c.task_point_id);return tp?('任务点 '+tp.id):'—';}

    function tpStats(tpId){
      const tpClues=clues.value.filter(c=>c.task_point_id===tpId);
      const tpGD=goldenDews.value.filter(g=>g.task_point_id===tpId);
      const trueIds=new Set(clues.value.filter(c=>c.task_point_id===tpId&&c.clue_type==='真').map(c=>c.id));
      const tpDews=dews.value.filter(d=>trueIds.has(d.id));
      return {
        clue:{total:tpClues.length,raw:tpClues.filter(c=>c.status==='未收集').length,revealed:tpClues.filter(c=>c.status==='已发现未收集'||c.status==='已收集未发现').length,collected:tpClues.filter(c=>c.status==='已收集已发现'||c.status==='已收集未发现').length},
        gd:{total:tpGD.length,raw:tpGD.filter(g=>g.status==='未收集').length,collected:tpGD.filter(g=>g.status==='已收集').length,used:tpGD.filter(g=>g.status==='已使用').length},
        dew:{total:tpDews.reduce((s,d)=>s+(d.dew_value||2),0),raw:tpDews.filter(d=>d.status==='未收集').reduce((s,d)=>s+(d.dew_value||2),0),revealed:tpDews.filter(d=>d.status==='已发现未收集').reduce((s,d)=>s+(d.dew_value||2),0),collected:tpDews.filter(d=>d.status==='已收集').reduce((s,d)=>s+(d.dew_value||2),0)}
      };
    }

    function hunterStats(name){
      const hc=clues.value.filter(c=>c.hunter_name===name);
      const hd=dews.value.filter(d=>d.hunter_name===name);
      return {
        clue:{total:hc.length,raw:hc.filter(c=>c.status==='未收集').length,revealed:hc.filter(c=>c.status==='已发现未收集'||c.status==='已收集未发现').length,collected:hc.filter(c=>c.status==='已收集已发现'||c.status==='已收集未发现').length},
        dew:{total:hd.reduce((s,d)=>s+(d.dew_value||2),0),raw:hd.filter(d=>d.status==='未收集').reduce((s,d)=>s+(d.dew_value||2),0),revealed:hd.filter(d=>d.status==='已发现未收集').reduce((s,d)=>s+(d.dew_value||2),0),collected:hd.filter(d=>d.status==='已收集').reduce((s,d)=>s+(d.dew_value||2),0)}
      };
    }
    const dewAllStats=computed(()=>{
      const total=dews.value.reduce((s,d)=>s+(d.dew_value||2),0);
      const collected=dews.value.filter(d=>d.status==='已收集').reduce((s,d)=>s+(d.dew_value||2),0);
      const revealed=dews.value.filter(d=>d.status==='已发现未收集').reduce((s,d)=>s+(d.dew_value||2),0);
      return {total,collected,revealed,raw:total-collected-revealed};
    });
    const dewPairingInfo=computed(()=>{
      if(edDew.pool==='hunter')return '猎人池：独立记录，无需配对线索（当前归属猎人「'+(edDew.hunter_name||'')+'」）。';
      const id=Number(edDew.id);
      if(!id)return '任务点池：填写编号后，将自动按同编号「真线索」配对其所属任务点。';
      const c=clues.value.find(c=>c.id===id&&c.clue_type==='真');
      if(!c)return '任务点池：未找到编号 '+id+' 的同编号真线索，请先在线索管理新建该编号真线索。';
      const tp=taskPoints.value.find(t=>t.id===c.task_point_id);
      return '任务点池：配对线索 #'+c.id+' → '+(tp?('任务点 '+tp.id+' '+tp.name):'无主线索（请给该线索指定任务点）');
    });
    function onDewPoolChange(){if(edDew.pool!=='hunter'){edDew.hunter_name=null;}}

    async function api(p,o){
      try{const r=await fetch(p,o);if(!r.ok)throw new Error((await r.json()).detail||'Err');return await r.json();}
      catch(e){showToast(e.message,'error');throw e;}
    }
    async function fs(){const d=await api('/api/status');Object.assign(st,d);}
    async function fd(){dews.value=await api('/api/dews');}
    async function fc(){clues.value=await api('/api/clues');}
    async function ft(){taskPoints.value=await api('/api/task_points');}
    async function fp(){players.value=await api('/api/players');Object.assign(pstats,await api('/api/player/stats'));}
    async function fgd(){goldenDews.value=await api('/api/golden_dews');}
    async function ffb(){npcs.value=await api('/api/npcs');}

    const filteredPlayers=computed(()=>{
      let list=players.value.slice();

    const filteredDews=computed(()=>{

    const filteredClues=computed(()=>{
      let list=clues.value.slice();

    async function doImport(){
      if(!importFile.value)return;importing.value=true;
      try{const form=new FormData();form.append('file',importFile.value);const r=await fetch('/api/import/all',{method:'POST',body:form});if(!r.ok)throw new Error('HTTP '+r.status);const result=await r.json();
        const errs=Array.isArray(result.errors)?result.errors:[];const msg=[];
        for(const[k,v]of Object.entries(result)){if(k==='errors')continue;if(typeof v==='number'&&v>0)msg.push(k+' +'+v);}
        if(errs.length){console.warn('导入错误:',errs);showToast((msg.length?msg.join('，')+'；':'')+errs.length+' 行失败','error');}
        else if(msg.length)showToast('导入成功：'+msg.join('，'),'success');else showToast('未导入任何数据','error');
        importFile.value=null;fd();fc();ft();fs();fp();fgd();ffb();
